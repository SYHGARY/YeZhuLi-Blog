backend:
  name: github
  repo: SYHGARY/YeZhuLi-Blog
  branch: main
  base_url: https://boarhedge-oauth.1542638802.workers.dev/

# 媒体（照片）上传到这个文件夹（绝对路径，从站点根目录开始）
media_folder: /assets/images/photos
public_folder: /assets/images/photos

# 发布后显示的网站地址
site_url: https://boarhedge.pages.dev

collections:
  - name: posts
    label: 文章
    folder: posts
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: '{{slug}}'
    editor:
      preview: false
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 日期, name: date, widget: string, hint: '格式：2026-09-26' }
      - label: 分类
        name: category
        widget: select
        options: [日常, 旅行, 读书观影, 碎碎念]
        default: 日常
      - label: 标签
        name: tags
        widget: list
        summary: '{{fields.tag}}'
        field: { label: 标签, name: tag, widget: string }
        allow_add: true
      - { label: 作者, name: author, widget: string, hint: '小宋 或 小李' }
      - label: 摘要
        name: excerpt
        widget: text
        hint: '显示在时间线上的一句话简介'
      - label: 封面图
        name: cover
        widget: image
        required: false
        media_folder: /assets/images/photos
        public_folder: /assets/images/photos
      - label: 文章图片
        name: images
        widget: list
        summary: '{{fields.image}}'
        field: { label: 图片, name: image, widget: image, media_folder: /assets/images/photos, public_folder: /assets/images/photos }
        allow_add: true
        required: false
      - { label: 正文, name: body, widget: markdown }
