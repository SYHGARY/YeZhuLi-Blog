<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>野猪篱 · 后台</title>
  <style>
    body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         background:#E8F5E9;display:flex;align-items:center;justify-content:center;min-height:100vh;color:#2E4D20}
    .loading{text-align:center;padding:40px}
    .boar{font-size:48px;margin-bottom:16px}
    .err{max-width:420px;font-size:14px;line-height:1.8;color:#8D6E63}
    .err a{color:#7CB342}
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="boar">🐗</div>
    <p>正在打开后台…</p>
    <p style="font-size:12px;color:#8D6E63">如果一直转圈，请检查网络</p>
  </div>

  <script>
    // 多 CDN 备用加载 Decap CMS
    var CDNS = [
      'https://cdn.jsdelivr.net/npm/decap-cms@3.1.12/dist/decap-cms.js',
      'https://unpkg.com/decap-cms@3.1.12/dist/decap-cms.js',
      'https://cdnjs.cloudflare.com/ajax/libs/decap-cms/3.1.12/decap-cms.min.js'
    ];
    var i = 0;
    function loadNext() {
      if (i >= CDNS.length) {
        document.getElementById('loading').innerHTML =
          '<div class="boar">🐗</div><p><strong>后台没加载出来</strong></p>' +
          '<p class="err">可能是网络问题。请用 Chrome / Edge 打开，<br>' +
          '或刷新一次。如果还是不行，把这个页面的网址发给我。</p>';
        return;
      }
      var s = document.createElement('script');
      s.src = CDNS[i++];
      s.onload = function () {
        // Decap 自动初始化，会自动接管整个页面
      };
      s.onerror = loadNext;
      document.head.appendChild(s);
    }
    loadNext();
  </script>
</body>
</html>
