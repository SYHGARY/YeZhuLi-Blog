<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>野猪篱 · 后台</title>
  <style>
    body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         background:#E8F5E9;display:flex;align-items:center;justify-content:center;min-height:100vh;color:#2E4D20}
    .box{text-align:center;padding:40px;max-width:480px}
    .boar{font-size:48px;margin-bottom:16px}
    .step{font-size:14px;line-height:2;color:#2E4D20;text-align:left;margin:20px 0}
    code{background:#fff;padding:2px 6px;border-radius:4px;font-size:13px;color:#8D6E63}
  </style>
</head>
<body>
  <div class="box" id="box">
    <div class="boar">🐗</div>
    <p>正在打开后台…</p>
  </div>

  <script>
    var s = document.createElement('script');
    s.src = 'decap-cms.js?t=' + Date.now();
    s.onload = function () { /* Decap 自动接管页面 */ };
    s.onerror = function () {
      document.getElementById('box').innerHTML =
        '<div class="boar">🐗</div>' +
        '<p><strong>缺一个文件：admin/decap-cms.js</strong></p>' +
        '<div class="step">' +
        '<p>请按下面操作：</p>' +
        '<p>1. 在浏览器打开 <a href="https://unpkg.com/decap-cms@3.1.12/dist/decap-cms.js" target="_blank">https://unpkg.com/decap-cms@3.1.12/dist/decap-cms.js</a></p>' +
        '<p>2. 页面会显示一大段代码，按 <code>Ctrl+S</code> 保存</p>' +
        '<p>3. 文件名填 <code>decap-cms.js</code>，保存到你项目的 <code>admin/</code> 文件夹</p>' +
        '<p>4. 推到 GitHub，等 Netlify 重新部署后刷新本页</p>' +
        '</div>';
    };
    document.head.appendChild(s);
  </script>
</body>
</html>
